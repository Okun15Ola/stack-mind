# Calls the production Paystack poller every 5 minutes. Vercel Hobby only
# allows a daily cron (kept in vercel.json as a fallback). The poller is
# idempotent and locked, so overlap between the two is harmless.
name: Poll Paystack

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: poll-paystack
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call poller
        env:
          POLLER_URL: ${{ secrets.POLLER_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$POLLER_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Repository secrets POLLER_URL and CRON_SECRET must both be set"
            exit 1
          fi
          case "$POLLER_URL" in
            https://*) ;;
            *) echo "::error::POLLER_URL must be https"; exit 1 ;;
          esac

          status=$(curl --silent --show-error --max-time 90 \
            --output response.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$POLLER_URL") || { echo "::error::Request to poller failed"; exit 1; }

          echo "HTTP $status"
          cat response.json 2>/dev/null; echo

          if [ "$status" != "200" ]; then
            echo "::error::Poller returned HTTP $status"
            exit 1
          fi
